{
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "half",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
      "model": "Jarbas/ovos-model2vec-intents-roberta-large-ca-v2-massive"
    }
  },
  "listener": {
    "stand_up_word": "wake_up"
  },
  "hotwords": {
    "wake_up": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "d ə s p ɛ r t ə",
        "d e s p ɛ r t ɛ",
        "d e s p ɛ ɾ t a",
        "d ə s p ɛ ɾ t ə",
        "d ə s p ɛ r t ə t ə"
      ],
      "wakeup": true,
      "fallback_ww": "wake_up_vosk"
    },
    "wake_up_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "desperta't",
        "desperta",
        "desperti's",
        "desperteu-vos",
        "despertar"
      ],
      "lang": "ca",
      "wakeup": true
    },
    "stop_recording": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "ə t u ɾ ə l ə ɣ ɾ ə β ə s i o",
        "a t u ɾ ɛ l a ɣ ɾ a β a s j o",
        "a t u ɾ a l a ɣ ɾ a v a s j o",
        "ə t u ɾ ə l ə ɣ ɾ ə v ə s i o"
      ],
      "stopword": true,
      "fallback_ww": "stop_recording_vosk"
    },
    "stop_recording_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "atura la gravació",
        "para de gravar"
      ],
      "lang": "ca",
      "stopword": true
    }
  }
}
