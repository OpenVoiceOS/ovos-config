{
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "half",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
      "model": "Jarbas/ovos-model2vec-intents-bertinho-gl-base-cased"
    }
  },
  "listener": {
    "stand_up_word": "wake_up"
  },
  "hotwords": {
    "wake_up": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "d e s p ɛ ɾ t a",
        "a k o ɾ d a"
      ],
      "wakeup": true,
      "fallback_ww": "wake_up_vosk"
    },
    "wake_up_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "acorda",
        "acordar",
        "desperta",
        "despertar"
      ],
      "lang": "pt",
      "wakeup": true
    },
    "stop_recording": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": "p a ɾ a ð e ɡ ɾ a β a ɾ",
      "stopword": true,
      "fallback_ww": "stop_recording_vosk"
    },
    "stop_recording_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "para de gravar"
      ],
      "lang": "pt",
      "stopword": true
    }
  }
}
