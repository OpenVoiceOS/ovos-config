{
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "full",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
      "model": "Jarbas/ovos-model2vec-intents-serafim-335m-portuguese-pt-sentence-encoder"
    }
  },
  "listener": {
    "stand_up_word": "wake_up"
  },
  "hotwords": {
    "wake_up": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "ɐ k ɔ ɾ d ɐ",
        "d ɨ ʃ p ɛ ɾ t ɐ"
      ],
      "wakeup": true,
      "fallback_ww": "wake_up_vosk"
    },
    "wake_up_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "acorda",
        "acordar",
        "desperta",
        "despertar"
      ],
      "lang": "pt",
      "wakeup": true
    },
    "stop_recording": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "p ɐ ɾ ɐ d ɨ ɡ ɾ ɐ v a ɾ",
        "p a ɾ ɨ d ɨ ɡ ɾ ɐ v a ɾ",
        "p ɐ ɾ a ɾ d ɨ ɡ ɾ ɐ v a ɾ",
        "p ɐ ɾ a ɾ ɡ ɾ ɐ v ɐ s ɐ̃ʊ̃"
      ],
      "stopword": true,
      "fallback_ww": "stop_recording_vosk"
    },
    "stop_recording_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "para de gravar",
        "pare de gravar",
        "parar de gravar",
        "parar gravação"
      ],
      "lang": "pt",
      "stopword": true
    }
  }
}