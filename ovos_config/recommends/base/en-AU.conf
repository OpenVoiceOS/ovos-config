{
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "half",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
      "model": "Jarbas/ovos-model2vec-intents-potion-32M"
    }
  },
  "listener": {
    "stand_up_word": "wake_up"
  },
  "hotwords": {
    "wake_up": {
      "module": "ovos-ww-plugin-wakeforge",
      "model": "wakehubert_wake_up",
      "wakeup": true,
      "fallback_ww": "wake_up_vosk"
    },
    "wake_up_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "wake up"
      ],
      "lang": "en-US",
      "wakeup": true
    },
    "stop_recording": {
      "module": "ovos-ww-plugin-wakeforge-zeroshot",
      "ipa": [
        "s t ɑː p ɹ ᵻ k ɔːɹ d ɪ ŋ",
        "ɛ n d ɹ ᵻ k ɔːɹ d ɪ ŋ"
      ],
      "stopword": true,
      "fallback_ww": "stop_recording_vosk"
    },
    "stop_recording_vosk": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "stop recording",
        "end recording"
      ],
      "lang": "en-US",
      "stopword": true
    }
  }
}
